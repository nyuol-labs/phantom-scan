[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phantom-scan"
version = "0.1.0-alpha"
description = "Adaptive timing-based stealth network scanner"
authors = [{name = "Nyoul Labs", email = "nyuollabs.dev@gmail.com"}]
maintainers = [{name = "Nyoul Labs", email = "nyuollabs.dev@gmail.com"}]
requires-python = ">=3.9"
dependencies = [
    "scapy>=2.5.0",
    "netifaces>=0.11.0",
    "python-nmap>=0.7.1",
    "tabulate>=0.9.0",
    "colorama>=0.4.6",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "click>=8.1.7",
    "rich>=13.7.0",
    "cryptography>=41.0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312", "py313"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
